function itemHTML(item){

function tableBlock(tbl){

}

{ id:8, title:"Linux Security Principles — Deep Dive", sec:[
  { t:"The Permission Model (Owner/Group/Other)", kind:'text', paras:[
    "Every file and directory on Linux has three sets of permissions — <strong>Owner</strong>, <strong>Group</strong>, and <strong>Other</strong> — each of which can independently have <strong>Read (r)</strong>, <strong>Write (w)</strong>, and <strong>Execute (x)</strong> permissions. This is represented numerically in <strong>octal notation</strong> (e.g. 755, 644) or symbolically (e.g. rwxr-xr-x).",
    "This model enforces access control at the filesystem level and is the foundation for the vast majority of Linux security decisions. Misconfigured permissions — files that are world-writable, or executables with excessive rights — are among the most common root causes of privilege escalation."
  ]},
  { t:"SUID, SGID, and the Sticky Bit", kind:'text', paras:[
    "The <strong>SUID (Set User ID)</strong> bit, when set on an executable, causes the program to run with the privileges of the file's owner rather than the user who executed it. This is how programs like passwd allow ordinary users to modify a root-owned file safely — but a misconfigured SUID binary can be a direct path to root.",
    "The <strong>SGID (Set Group ID)</strong> bit behaves similarly but for group ownership, and when applied to a directory, causes new files created within it to inherit the directory's group.",
    "The <strong>Sticky Bit</strong>, commonly applied to shared directories like /tmp, ensures that only the file's owner (or root) can delete or rename it, even if other users have write access to the directory."
  ]},
  { t:"sudo and Privilege Escalation Controls", kind:'text', paras:[
    "<strong>sudo</strong> allows a permitted user to execute a command as another user — typically root — as defined in the <strong>/etc/sudoers</strong> file. Properly configured, sudo enforces the principle of least privilege by granting only the specific commands a user needs.",
    "Misconfigured sudo rules — such as allowing a user to run an editor, interpreter, or archiving tool as root with NOPASSWD — are a leading cause of Linux privilege escalation. Security teams should routinely audit sudoers entries against tools like GTFOBins, which catalogs binaries that can be abused to break out to a root shell when granted excessive sudo or SUID rights."
  ]},
  { t:"Defense in Depth on Linux", kind:'text', paras:[
    "Just as in network security, Linux hardening relies on layering multiple independent controls so that a failure in one layer does not lead to full compromise."
  ], list:[
    "Account hardening (strong passwords, key-based SSH, disabled root login)",
    "Filesystem permissions and ACLs",
    "Mandatory Access Control (SELinux/AppArmor)",
    "Host-based firewalling (iptables/nftables/ufw)",
    "Patch management and kernel updates",
    "File integrity monitoring (AIDE/Tripwire)",
    "Centralized logging and auditing (auditd, journald, SIEM forwarding)",
    "Rootkit/malware scanning (rkhunter, chkrootkit, Lynis)",
    "A hardened, monitored Linux host is significantly harder to compromise and easier to investigate after an incident, which is why Linux hardening remains a core skill for both system administrators and security engineers."
  ]}
]}
];
// ---------- render ----------
const main = document.getElementById('main');
const tocGrid = document.getElementById('tocGrid');
let sectionCount = 0, topicCount = 0;
const letters = "ABCDEFGH";

PARTS.forEach((part, idx)=>{
  sectionCount += part.sec.length;
  part.sec.forEach(s=> topicCount += topicCountOf(s));

  const partEl = document.createElement('div');
  partEl.className = 'part';
  partEl.id = 'part-'+part.id;

  const noteHTML = part.note ? `<p class="part-sub">${part.note}</p>` : '';

  partEl.innerHTML = `
    <div class="part-head"><span class="letter">${letters[idx]}</span><h2>${part.title}</h2></div>
    ${noteHTML}
    <div class="sections"></div>
  `;

  const secHost = partEl.querySelector('.sections');
  part.sec.forEach(s=>{
    const d = document.createElement('details');
    d.className = 'section';
    const toolsBadge = s.tools ? ` <span class="code">tools: ${s.tools.join(', ')}</span>` : '';
    d.innerHTML = `<summary>${s.t} <span class="code">/${topicCountOf(s)} items/</span>${toolsBadge}</summary>
      <div class="section-body">${bodyHTML(s)}</div>`;
    secHost.appendChild(d);
  });

  main.appendChild(partEl);

  const a = document.createElement('a');
  a.href = '#part-'+part.id;
  a.innerHTML = `<b>${letters[idx]}</b> ${part.title}`;
  tocGrid.appendChild(a);
});

document.getElementById('statSections').textContent = sectionCount;
document.getElementById('statTopics').textContent = topicCount;

document.getElementById('expandAll').onclick = ()=> document.querySelectorAll('details.section').forEach(d=>d.open=true);
document.getElementById('collapseAll').onclick = ()=> document.querySelectorAll('details.section').forEach(d=>d.open=false);

document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.part').forEach(part=>{
    let partMatch = false;
    part.querySelectorAll('details.section').forEach(d=>{
      const text = d.textContent.toLowerCase();
      const match = q === '' || text.includes(q);
      d.classList.toggle('hidden', !match);
      if(match){ d.open = q !== ''; partMatch = true; }
    });
    part.classList.toggle('hidden', !partMatch);
  });
});
</script>
