function itemHTML(item){
  if(typeof item === 'string') return `<li>${item}</li>`;
  const subs = item.sub.map(s=>`<li>${s}</li>`).join('');
  return `<li>${item.t}<ul>${subs}</ul></li>`;
}
function listBlock(items){ return `<ul>${items.map(itemHTML).join('')}</ul>`; }
function textBlock(paras){ return paras.map(p=>`<p>${p}</p>`).join(''); }
function tableBlock(tbl){
  const head = `<tr>${tbl.headers.map(h=>`<th>${h}</th>`).join('')}</tr>`;
  const rows = tbl.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
  return `<table>${tbl.caption?`<caption>${tbl.caption}</caption>`:''}${head}${rows}</table>`;
}

      advantages:["REST: simple, cacheable, widely understood.","GraphQL: avoids over/under-fetching data, strongly typed schema.","Both are language-agnostic and scale well.","Great tooling ecosystem (Postman, Apollo, Swagger)."],
      disadvantages:["REST: can require multiple round-trips for nested data.","GraphQL: added complexity, caching is harder, potential for expensive queries.","Both require careful auth and rate-limiting design."],
      example:"A mobile app uses GraphQL to fetch a user's profile, recent posts, and friend count in a single request instead of three separate REST calls." },
    { name:"CI/CD & Cloud Deployment", def:["<strong>CI/CD (Continuous Integration/Continuous Deployment)</strong> automates testing and deployment of code changes, while cloud platforms like <strong>Vercel, AWS, and Render</strong> host the running application."],
      functions:["Automatically runs tests on every push/PR.","Builds and deploys the app on merge to main.","Manages environment variables and secrets.","Supports rollback to previous deployments."],
      advantages:["Faster, safer, more frequent releases.","Reduces manual deployment errors.","Enables preview deployments for every PR.","Scales automatically with cloud infrastructure."],
      disadvantages:["Initial pipeline setup takes time.","Misconfigured pipelines can leak secrets.","Cloud costs require ongoing monitoring."],
      example:"Every pull request automatically gets a live preview URL on Vercel, and merging to main triggers a production deployment via GitHub Actions." }
  ]}
]},

{ id:8, title:"Full Stack Architecture — Deep Dive", sec:[
  { t:"REST API Design Principles", kind:'text', paras:[
    "<strong>REST (Representational State Transfer)</strong> is an architectural style for designing networked APIs around <strong>resources</strong> — nouns like /users or /orders — manipulated through standard HTTP verbs: <strong>GET</strong> (read), <strong>POST</strong> (create), <strong>PUT/PATCH</strong> (update), and <strong>DELETE</strong> (remove).",
    "Well-designed REST APIs are <strong>stateless</strong> — each request contains all the information needed to process it, with no server-side session state between requests — and use HTTP status codes correctly (200 for success, 400 for client error, 401/403 for auth failures, 404 for not found, 500 for server error) so clients can reason about outcomes without parsing response bodies."
  ]},
  { t:"Database Design & Normalization", kind:'text', paras:[
    "Good database design starts with identifying <strong>entities</strong> (users, products, orders) and their relationships (one-to-one, one-to-many, many-to-many), then organizing data to minimize redundancy through a process called <strong>normalization</strong>.",
    "In relational databases, <strong>normal forms (1NF, 2NF, 3NF)</strong> progressively eliminate duplicate data and update anomalies by splitting information into related tables connected via foreign keys. In some high-read scenarios, <strong>denormalization</strong> is deliberately applied to trade some redundancy for query performance."
  ]},
  { t:"Authentication vs Authorization in Web Apps", kind:'text', paras:[
    "<strong>Authentication</strong> confirms who a user is — typically via a password, OAuth login, or a valid session/token. <strong>Authorization</strong> determines what that authenticated user is allowed to do — enforced through role-based access control (RBAC) or attribute-based access control (ABAC) checks on every protected route.",
    "A common and secure pattern is issuing a short-lived <strong>JWT (JSON Web Token)</strong> after login, paired with a longer-lived <strong>refresh token</strong> stored securely (often as an HTTP-only cookie) to renew access without forcing the user to log in repeatedly, while limiting the damage window if a token is ever stolen."
  ]},
  { t:"Scalability & the Full Stack", kind:'text', paras:[
    "As applications grow, each layer of the stack has its own scaling strategy, and a mature full stack engineer understands how they interact."
  ], list:[
    "Frontend: CDN distribution, code splitting, edge caching",
    "Backend: horizontal scaling (more instances) behind a load balancer",
    "Database: read replicas, connection pooling, sharding for very large datasets",
    "Caching: Redis/CDN layers to absorb repeated read traffic",
    "Asynchronous processing: message queues (RabbitMQ/Kafka) to decouple slow operations from the request/response cycle",
    "Understanding where a bottleneck actually lives — frontend rendering, backend compute, or database I/O — is what separates guesswork from effective, targeted optimization at scale."
  ]}
]}
];
// ---------- render ----------
const main = document.getElementById('main');
const tocGrid = document.getElementById('tocGrid');
let sectionCount = 0, topicCount = 0;
const letters = "ABCDEFGH";

PARTS.forEach((part, idx)=>{
  sectionCount += part.sec.length;
  part.sec.forEach(s=> topicCount += topicCountOf(s));

  const partEl = document.createElement('div');
  partEl.className = 'part';
  partEl.id = 'part-'+part.id;

  const noteHTML = part.note ? `<p class="part-sub">${part.note}</p>` : '';

  partEl.innerHTML = `
    <div class="part-head"><span class="letter">${letters[idx]}</span><h2>${part.title}</h2></div>
    ${noteHTML}
    <div class="sections"></div>
  `;

  const secHost = partEl.querySelector('.sections');
  part.sec.forEach(s=>{
    const d = document.createElement('details');
    d.className = 'section';
    const toolsBadge = s.tools ? ` <span class="code">tools: ${s.tools.join(', ')}</span>` : '';
    d.innerHTML = `<summary>${s.t} <span class="code">/${topicCountOf(s)} items/</span>${toolsBadge}</summary>
      <div class="section-body">${bodyHTML(s)}</div>`;
    secHost.appendChild(d);
  });

  main.appendChild(partEl);

  const a = document.createElement('a');
  a.href = '#part-'+part.id;
  a.innerHTML = `<b>${letters[idx]}</b> ${part.title}`;
  tocGrid.appendChild(a);
});

document.getElementById('statSections').textContent = sectionCount;
document.getElementById('statTopics').textContent = topicCount;

document.getElementById('expandAll').onclick = ()=> document.querySelectorAll('details.section').forEach(d=>d.open=true);
document.getElementById('collapseAll').onclick = ()=> document.querySelectorAll('details.section').forEach(d=>d.open=false);

document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.part').forEach(part=>{
    let partMatch = false;
    part.querySelectorAll('details.section').forEach(d=>{
      const text = d.textContent.toLowerCase();
      const match = q === '' || text.includes(q);
      d.classList.toggle('hidden', !match);
      if(match){ d.open = q !== ''; partMatch = true; }
    });
    part.classList.toggle('hidden', !partMatch);
  });
});
</script>
